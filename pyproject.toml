[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urgence-sante"
version = "0.1.0"
description = "Prototype d'IA d'assistance sanitaire en mode démonstration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "starlette==0.41.3",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.6",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "python-dotenv==1.0.1",
  "streamlit==1.41.1",
  "requests==2.32.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
